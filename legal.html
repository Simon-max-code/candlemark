<body>

<script>
const DOCS = {
  privacy: ['CopyleadTrader - TWM Ltd. Privacy Policy', [
    ['1. TWM Ltd. Privacy and Security Policy', 'TWM Ltd. (“we”, “us” or “TWM”) is a business company registered in Saint Lucia under registration number 2023-00068. We help traders and Introducing Brokers achieve their business goals and personal ambitions. Our business is built on integrity and trust, offering an industry-leading combination of dynamic products, competitive trading parameters and premium, one-on-one service. TWM’s mission is to enable the personal ambitions and business goals of Forex traders and IBs through dynamic products, competitive trading parameters and a premium customer experience.'],
    ['2. Commitment', 'TWM is committed to protecting the privacy of all personal information it obtains from you, including information obtained during your visits to this website or the provision of other services to you. TWM will only use your personal information in accordance with this Privacy and Security Policy and otherwise in accordance with the Privacy and Data Protection Act in Saint Lucia.'],
    ['3. TWM collects personal information', 'TWM collects certain personal information so that it may meet the needs of its customers. By collecting certain personal information, TWM can monitor and improve the services it offers to existing and potential customers. We will use this information to establish and maintain your account, provide our services to you, improve our services, make regulatory notifications and for marketing.'],
    ['4. What information does TWM obtain?', 'TWM will collect and hold information about you when you complete an online application or other type of form, or access and trade on your account through this website or another service we provide to you. TWM may derive information from your use of this website or another service we provide to you and may store this information with your personal profile. This information may include site areas visited, pages viewed, frequency and duration of visits, types of transactions conducted, documents downloaded, and other websites which may have referred you or to which you link.'],
    ['5. How will TWM use this information?', 'TWM may use this information for one or more of the following purposes:\n• to provide the services you have requested, including processing transactions;\n• to confirm your identity;\n• to maintain your personal profile and manage your account;\n• to contact you when necessary or appropriate in relation to the services being provided to you;\n• to keep you updated as a customer about matters such as contracts you have traded and TWM activities;\n• to manage and administer the products and services provided to you;\n• to provide you with information regarding products and services offered by TWM and to develop an understanding of the products and services you may be interested in obtaining from TWM;\n• to provide you with information or opportunities that we believe may be relevant to you;\n• to tailor the website or other service we provide to your needs and interests; and\n• to create anonymised statistical data.\n\nYou consent to TWM using your personal information for these purposes. You also consent to TWM transferring your personal information out of Saint Lucia where this is necessary for TWM to fulfil its contractual obligations to you. TWM only transfers personal information to organisations outside Saint Lucia if TWM has assessed the organisation as having appropriate controls and safeguards in place to protect your personal data.'],
    ['6. Who may TWM disclose this information to?', 'TWM may be required to provide your personal information to the regulator and government bodies from time to time. TWM may also disclose your personal information to:\n• financial institutions and other similar organisations with which it deals in the course of its corporate activities, or those nominated by you;\n• external service providers and professional advisers (which may be located overseas) that provide services to TWM;\n• any organisation at your request or any persons acting on your behalf, including your financial adviser, broker, solicitor or accountant;\n• third parties where this is necessary to process a transaction or provide services you have requested; or\n• any authority to whom TWM is required by law to disclose such information.\n\nTWM does not sell or provide your personal information to third parties for marketing purposes.'],
    ['7. Updating your information', 'You may inform TWM at any time that your personal details have changed or that you wish TWM to delete personal information it holds about you by emailing us. TWM will change or delete your personal information in accordance with your instructions, except to the extent that we are required to hold it for regulatory or legal purposes, to provide you with the services you have requested or to maintain adequate business records.'],
    ['8. Links', 'When you use this website or another service we provide to you, you may be able to link to other websites. This Privacy Policy does not apply to those sites. TWM encourages you to read the privacy policies on those sites.'],
    ['9. Cookies', 'TWM uses cookies to gather information about your access to this website and other services we provide to you. Cookies are small pieces of information which use a unique identification tag and are stored on your device as a result of your use of this website or another service we provide to you. When we use cookies, they collect statistical information about how you use our services. Most internet browsers are set up to accept cookies. If you do not wish to receive cookies, you may be able to change your browser settings to refuse all cookies or to have your computer notify you each time a cookie is sent to it, giving you the choice whether to accept it. However, this may impair the quality of the services we provide to you in relation to your account.'],
    ['10. Security', 'TWM takes security very seriously and adopts industry and information security best practices to protect your personal information and ensure it is not accessed by unauthorised persons. Measures include encryption of data during transmission, strong authentication mechanisms and secure access to machines and data.'],
    ['11. What are your rights?', 'You need not give us any of the personal information requested by TWM. However, without that information, TWM may be unable to open an account for you where the information is requested in an application form, or to provide you with other services, information or assistance you have sought. Should you have any questions or complaints about your privacy, please contact us. If a complaint is not resolved by TWM to your satisfaction, you may complain to the Information Commissioner.\n\nUnder data protection legislation, you have (subject to certain exceptions) the right to obtain copies of any personal information TWM holds about you and to inform TWM of any inaccuracy. If you have a request, please contact us to obtain a subject access request form. We may charge a nominal fee to cover the cost of verifying the application and locating, retrieving, reviewing and copying any material requested.'],
    ['12. Your consent', 'By accessing this website or another service we provide to you, you consent to TWM collecting, maintaining, using and disclosing personal information about you that is provided by you or by another person as described above.'],
    ['13. Amendments to policy', 'TWM may make changes to this Privacy and Security Policy from time to time for any reason and will notify you of such changes by posting an updated version of this policy on this website. You are responsible for regularly reviewing this Privacy and Security Policy. If you use this website or another service we provide to you after changes are published, that use constitutes your agreement to those changes.']
  ]],
  aml: ['AML Policy', [
    ['Commitment and purpose', 'TradeWithMentors is committed to the highest standards of Anti-Money Laundering (AML) compliance and Counter-Terrorism Financing (CTF). To help governments fight the funding of terrorism and money laundering, laws require financial institutions to obtain, verify, and record information that identifies each person opening an account.\n\nMoney laundering is the process of converting funds received from illegal activities (such as fraud, corruption, or terrorism) into other funds or investments that appear legitimate, in order to hide or distort the real source of the funds.\n\nThe process of money laundering can be divided into three sequential stages:\n• Placement: Funds are converted into financial instruments, such as cheques, bank accounts, and money transfers, or used to purchase high-value goods that can be resold. Funds may also be physically deposited into banks and non-bank institutions (for example, currency exchangers). To avoid suspicion, a launderer may make several deposits instead of depositing the entire sum at once; this form of placement is called smurfing.\n• Layering: Funds are transferred or moved to other accounts and financial instruments to disguise their origin and obscure the identity of the entity behind multiple financial transactions. Moving funds and changing their form makes the laundered money more difficult to trace.\n• Integration: Funds return to circulation as apparently legitimate funds used to purchase goods and services.\n\nTradeWithMentors adheres to the principles of AML and actively prevents actions that aim to legalise illegally gained funds or facilitate that process. This AML policy is intended to prevent criminals from using the company’s services for money laundering, terrorist financing, or other criminal activity.\n\nTo prevent money laundering, TradeWithMentors Markets neither accepts nor pays cash under any circumstances. The company reserves the right to suspend any client operation that staff consider illegal or potentially related to money laundering.'],
    ['Company procedures', 'TradeWithMentors will take steps to establish that it is dealing with a real person or legal entity. TradeWithMentors Markets also takes measures in accordance with applicable laws and regulations. The AML policy is implemented through:\n• Know Your Customer (KYC) policy and due diligence;\n• monitoring of client activity; and\n• record keeping.'],
    ['Know Your Customer and due diligence', 'In accordance with the company’s AML and KYC policies, each client must complete a verification procedure. Before starting a business relationship with a client, TradeWithMentors Markets will seek satisfactory evidence of the identity of each customer or counterparty, or take other measures that produce satisfactory evidence. The company applies heightened scrutiny to clients who reside in countries identified by credible sources as having inadequate AML standards or presenting a high risk of crime and corruption, and to beneficial owners who reside in or whose funds are sourced from designated countries.'],
    ['Individual clients', 'During registration, each client provides personal information, including full name, date of birth, country of origin, and complete residential address. To verify this information and meet KYC requirements, clients must provide:\n• a current, valid passport (the page showing the photograph and signature);\n• a driving licence bearing a photograph; or\n• a national identity card (both front and back);\n• documents proving current permanent address, such as utility bills or bank statements, containing the client’s full name and place of residence and dated no more than three months before submission.\n\nIf documents are written in non-Latin characters, a notarised English translation should be provided to avoid delays in verification.'],
    ['Corporate clients', 'Where an applicant company is listed on a recognised or approved stock exchange, or independent evidence shows it is a wholly owned subsidiary or under the control of such a company, further identity verification steps will normally not be required. If the company is unquoted and none of its principal directors or shareholders already has an account with TradeWithMentors, it must provide:\n• Certificate of Incorporation or national equivalent;\n• Memorandum and Articles of Association and statutory statement, or national equivalents;\n• Certificate of good standing or other proof of the company’s registered address;\n• board resolution authorising the account and the persons who will operate it;\n• copies of powers of attorney or other authorities granted by the directors in relation to the company;\n• proof of identity for any director who will deal with TradeWithMentors on the customer’s behalf, following the individual identity verification requirements above; and\n• proof of identity for beneficial owners and any persons on whose instructions account signatories are authorised to act, following the individual identity verification requirements above.'],
    ['Monitoring of client activity', 'In addition to gathering information from clients, TradeWithMentors continues to monitor each client’s activity to identify and prevent suspicious transactions. A suspicious transaction is one that is inconsistent with the client’s legitimate business or the usual transaction history known from monitoring client activity. TradeWithMentors has implemented systems to monitor transactions automatically and, where needed, manually to prevent criminals from using the company’s services.'],
    ['Record keeping', 'Records must be kept of all transaction data and identification data, as well as documents relating to money laundering matters (for example, files on suspicious activity reports and documentation of AML account monitoring). These records are kept for a minimum of seven years after the account is closed.'],
    ['Deposit and withdrawal requirements', 'All deposits and withdrawals on trading accounts held with TradeWithMentors are subject to these requirements:\n• Due to AML/CTF laws, TradeWithMentors cannot receive or deposit funds from third parties.\n• Details of funds sent to TradeWithMentors must be provided on the TradeWithMentors platform only.\n• All funds withdrawn from a trading account must be sent to a bank account, credit/debit card, or alternative payment method (crypto) available on the TradeWithMentors platform.\n• Withdrawal requests are processed on a First-In-First-Out (FIFO) basis according to the funding source. For example, where a deposit is made by debit/credit card and a subsequent withdrawal is requested, the amount returned to that card may not exceed the original deposit. Any profits exceeding the deposited amount will be transferred to a nominated bank account held in the same name as the trading account.'],
    ['Measures taken', 'Where TradeWithMentors suspects that an attempted transaction is related to money laundering or other criminal activity, it will proceed in accordance with applicable law and report suspicious activity to the relevant regulatory authority.\n\nTradeWithMentors reserves the right to suspend any client operation that staff consider illegal or potentially related to money laundering. TradeWithMentors may, at its discretion, temporarily block a suspicious client account or terminate an existing client relationship.']
  ]]
};
const esc = (value) => value.replace(/[&<>]/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[char]));
const key = new URLSearchParams(location.search).get('p') || 'terms';
const [title, sections] = key === 'terms' ? ['Terms & Conditions', []] :
  DOCS[key] || ['Anti-Money Laundering Policy', DOCS.aml[1]];
document.title = title + ' — mentorsedgepro';
const root = document.getElementById('lg');
if (key === 'terms') {
  root.innerHTML = `<h1>${esc(title)}</h1><p>TWM Ltd Client Agreement · Version: December 2023</p><pre class="lg-document" id="terms-document">Loading agreement…</pre>`;
  fetch('terms.txt').then((response) => {
    if (!response.ok) throw new Error(`Unable to load the agreement (${response.status}).`);
    return response.text();
  }).then((text) => {
    document.getElementById('terms-document').textContent = text;
  }).catch((error) => {
    document.getElementById('terms-document').textContent = `The agreement could not be loaded. ${error.message}`;
  });
} else {
  const version = key === 'privacy' ? 'Version: March 2023' : '';
  root.innerHTML = `<h1>${esc(title)}</h1>${version ? `<p>${version}</p>` : ''}` +
    sections.map(([heading, text]) => `<h2>${esc(heading)}</h2><p style="white-space:pre-line">${esc(text)}</p>`).join('');
}
</script>
</body>
</html>
