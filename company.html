<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Company — mentorsedgepro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.co{max-width:760px;margin:0 auto;padding:110px 22px 60px}
.co h1{font-size:clamp(1.8rem,4vw,2.4rem);margin:6px 0 16px}
.co h2{margin:28px 0 8px;font-size:1.15rem}.co p{color:var(--text-secondary);margin-bottom:10px}
.co .note{padding:14px 16px;border:1px solid var(--gold-dim);border-radius:8px;background:var(--bg-panel);color:var(--text-primary);font-size:.9rem}
.co-cta{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap}
</style>
</head>
<body>
<header class="nav scrolled"><div class="nav-inner">
  <a href="index.html" class="brand"><span class="brand-word">Mentorsedge<em>Pro</em></span></a>
  <div class="nav-actions"><a href="login.html" class="btn-ghost">Log in</a><a href="register.html" class="btn-solid"><span>Get Started</span></a></div>
</div></header>
<main class="co" id="co"></main>
<script>
const P = {
  about: ['About us', 'Company', [
    ['What we do', 'MentorsedgePro provides a web interface for account registration, market information, mentor profiles, and copy-trading features. Some displayed data or features may be simulated or illustrative, and availability may depend on your account and location.'],
    ['How mentors are presented', 'The site does not publish a detailed, independently verifiable mentor identity or track-record review process. Mentor profiles and performance figures may be simulated or illustrative; do not treat profile labels or displayed results as independently verified.'],
    ['Our story', 'A verifiable company history or founding date is not published in the materials currently available on this site.'],
    ['Where we are', 'The site materials do not currently identify the operating legal entity, company registration number, or registered office. Review the legal terms and verify the operator before relying on the service.'],
  ]],
  security: ['Regulation & Security', 'Trust', [
    ['Regulatory status', 'The site materials do not identify a regulator, licence number, or separate regulated broker, and do not establish that the platform is authorised to provide regulated financial services. Account registration or demo access is not evidence of authorisation. Verify the provider and its permissions with the relevant regulator before transferring funds or trading.'],
    ['Account security', 'The sign-in flow uses an email address and password and may request a six-digit two-factor authentication code. The site materials do not describe password storage or session-security controls, or confirm that two-factor authentication is available to every user. Use a unique password, never share authentication codes, and contact Support if you suspect unauthorised access.'],
    ['Your funds', 'The site does not provide verifiable details about who holds client funds or whether funds are segregated, insured, or covered by a compensation scheme. Displayed balances may be simulated or illustrative. Confirm the provider, custody arrangements, and applicable protections before sending money.'],
    ['Data protection', 'The Privacy Policy currently contains draft fields for the legal data controller, service providers, retention periods, and other practices. Those details should be verified with the operator before submitting identity or financial information.'],
    ['Reporting a problem', 'For support enquiries or to report suspicious activity, contact us through <a href="support.html" style="color:var(--bull)">Support</a>.'],
  ]],
};
const key = new URLSearchParams(location.search).get('p');
const [title, eyebrow, secs] = P[key] || P.about;
document.title = title + ' — mentorsedgepro';
const esc = (s) => s.replace(/[&<>]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
document.getElementById('co').innerHTML = `<span class="eyebrow">${eyebrow}</span><h1>${title}</h1>` +
  secs.map(([h, t]) => `<h2>${esc(h)}</h2><p>${t.includes('<a ') ? t : esc(t)}</p>`).join('') +
  `<p class="note">Trading involves a high risk of loss. Accounts and figures on this platform may be simulated.</p>
   <div class="co-cta"><a href="register.html" class="btn-solid"><span>Open a free account</span></a><a href="mentorboard.html" class="btn-outline"><span>Browse mentors</span></a></div>`;
</script>
</body>
</html>
