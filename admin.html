<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — mentorsedgepro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body::before{display:none}
.ad{max-width:1200px;margin:0 auto;padding:24px}
.ad-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.ad-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.ad-tabs button{padding:9px 14px;border:1px solid var(--line);border-radius:9px;color:var(--text-secondary);font-size:13px;font-weight:600}
.ad-tabs button.on{background:var(--bg-panel-3);color:var(--text-primary);border-color:var(--line-strong)}
.ad table{width:100%;border-collapse:collapse;font-size:13px}
.ad th{text-align:left;color:var(--text-tertiary);font:500 10.5px var(--font-mono);text-transform:uppercase;padding:0 10px 10px}
.ad td{padding:10px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
.ad .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;margin-bottom:16px;overflow-x:auto}
.ad input,.ad select,.ad textarea{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text-primary);font-size:13px;width:100%}
.ad label{display:block;font-size:11.5px;color:var(--text-tertiary);margin:10px 0 4px}
.ad .b{padding:6px 11px;border:1px solid var(--line-strong);border-radius:7px;font-size:12px;font-weight:600;margin:2px}
.ad .b:hover{border-color:var(--bull);color:var(--bull)}
.ad .b.r:hover{border-color:var(--bear);color:var(--bear)}
.ad .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.ad pre{white-space:pre-wrap;font:12px var(--font-mono);color:var(--text-secondary)}
#msg{position:fixed;bottom:20px;right:20px;background:var(--bg-panel-3);border:1px solid var(--line-strong);padding:12px 16px;border-radius:10px;display:none;z-index:9;max-width:340px;font-size:13px}
.ad-tabs button:hover{color:var(--text-primary)}
.ad .card{box-shadow:0 8px 24px -16px rgba(0,0,0,.6)}
.ad form .g{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
@media(max-width:720px){
  #login{padding:16px!important}
  .ad{padding:12px}
  .ad-top h2{font-size:1.15rem}
  .ad-tabs{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 14px;padding:2px 12px 8px;scrollbar-width:none;position:sticky;top:0;z-index:5;background:var(--bg-void)}
  .ad-tabs::-webkit-scrollbar{display:none}
  .ad-tabs button{white-space:nowrap;flex-shrink:0;min-height:42px;padding:0 16px}
  .ad input,.ad select,.ad textarea,#login input{font-size:16px!important;min-height:44px}
  .ad .b{min-height:40px;padding:8px 14px;font-size:13px;margin:3px 3px 3px 0}
  .ad .g{grid-template-columns:1fr 1fr}
  .ad form .g{grid-template-columns:1fr}
  .ad .card{padding:14px}
  .ad table,.ad thead,.ad tbody,.ad tr,.ad td{display:block;width:100%}
  .ad thead{display:none}
  .ad tr{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:10px;background:var(--bg-panel-2)}
  .ad td{border:0;padding:6px 0;display:flex;justify-content:space-between;gap:12px;text-align:right}
  .ad td::before{content:attr(data-label);color:var(--text-tertiary);font:500 10.5px var(--font-mono);text-transform:uppercase;text-align:left;flex-shrink:0}
  .ad td:last-child{display:block;text-align:left;padding-top:10px;border-top:1px solid var(--line);margin-top:6px}
  .ad td:last-child::before{display:none}
}
</style>
</head>
<body>
<div id="login" style="display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px">
  <form id="lf" class="card" style="width:100%;max-width:360px;background:var(--bg-panel);border:1px solid var(--line);border-radius:16px;padding:28px">
    <h2 style="margin-bottom:6px">Admin login</h2>
    <p style="color:var(--text-tertiary);font-size:12.5px;margin-bottom:12px">Authorised staff only.</p>
    <input id="le" type="email" placeholder="Email" autocomplete="username" required style="width:100%;margin-top:8px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--text-primary)">
    <input id="lp" type="password" placeholder="Password" autocomplete="current-password" required style="width:100%;margin-top:8px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--text-primary)">
    <input id="lt" placeholder="2FA code" maxlength="6" inputmode="numeric" style="display:none;width:100%;margin-top:8px;background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;padding:11px;color:var(--text-primary)">
    <p id="lerr" style="color:var(--bear);font-size:12.5px;min-height:18px;margin:8px 0"></p>
    <button class="btn-solid btn-submit" style="width:100%;justify-content:center"><span>Log in</span></button>
  </form>
</div>
<div class="ad" style="display:none">
  <div class="ad-top"><h2>Admin <span id="who" style="font-size:.8rem;color:var(--text-tertiary)"></span></h2><div><a href="dashboard.html" class="link-muted">← Dashboard</a> <button class="link-muted" id="lo">Log out</button></div></div>
  <div class="ad-tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="msg"></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
