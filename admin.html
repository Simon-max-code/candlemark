<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — mentorsedgepro</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
body::before{display:none}
.ad{max-width:1200px;margin:0 auto;padding:24px}
.ad-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.ad-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.ad-tabs button{padding:9px 14px;border:1px solid var(--line);border-radius:9px;color:var(--text-secondary);font-size:13px;font-weight:600}
.ad-tabs button.on{background:var(--bg-panel-3);color:var(--text-primary);border-color:var(--line-strong)}
.ad table{width:100%;border-collapse:collapse;font-size:13px}
.ad th{text-align:left;color:var(--text-tertiary);font:500 10.5px var(--font-mono);text-transform:uppercase;padding:0 10px 10px}
.ad td{padding:10px;border-top:1px solid var(--line);vertical-align:top;word-break:break-word}
.ad .card{background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--radius-m);padding:18px;margin-bottom:16px;overflow-x:auto}
.ad input,.ad select,.ad textarea{background:var(--bg-panel-2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--text-primary);font-size:13px;width:100%}
.ad label{display:block;font-size:11.5px;color:var(--text-tertiary);margin:10px 0 4px}
.ad .b{padding:6px 11px;border:1px solid var(--line-strong);border-radius:7px;font-size:12px;font-weight:600;margin:2px}
.ad .b:hover{border-color:var(--bull);color:var(--bull)}
.ad .b.r:hover{border-color:var(--bear);color:var(--bear)}
.ad .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.ad pre{white-space:pre-wrap;font:12px var(--font-mono);color:var(--text-secondary)}
#msg{position:fixed;bottom:20px;right:20px;background:var(--bg-panel-3);border:1px solid var(--line-strong);padding:12px 16px;border-radius:10px;display:none;z-index:9;max-width:340px;font-size:13px}
</style>
</head>
<body>
<div class="ad">
  <div class="ad-top"><h2>Admin <span id="who" style="font-size:.8rem;color:var(--text-tertiary)"></span></h2><a href="dashboard.html" class="link-muted">← Dashboard</a></div>
  <div class="ad-tabs" id="tabs"></div>
  <div id="view"></div>
</div>
<div id="msg"></div>
<script src="config.js"></script>
<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
